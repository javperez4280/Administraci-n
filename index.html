<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>Listado</title>
<style>
:root{--azul:#1e3a8a;--azul2:#2563eb;--verde:#16a34a;--rojo:#dc2626;--amarillo:#f59e0b;--gris:#64748b;--fondo:#f1f5f9;--borde:#e2e8f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--fondo);color:#0f172a;font-size:16px}
header{background:var(--azul);color:#fff;padding:14px 16px;padding-top:max(14px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0}
header small{opacity:.8;display:block;font-size:12px}
main{padding:14px;max-width:760px;margin:0 auto;padding-bottom:90px}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
h2{font-size:17px;margin:0 0 12px}
label{display:block;font-size:13px;color:var(--gris);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--borde);border-radius:10px;font-size:16px;background:#fff;font-family:inherit}
textarea{min-height:120px}
button{border:0;border-radius:10px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;background:var(--azul2);color:#fff;font-family:inherit}
button.sec{background:#e2e8f0;color:#0f172a}
button.rojo{background:var(--rojo)}
button.verde{background:var(--verde)}
button.full{width:100%;margin-top:12px}
button:disabled{opacity:.5}
.fila{display:flex;gap:8px;align-items:center}
.fila>*{flex:1;min-width:0}
.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--borde);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs button{flex:1;background:none;color:var(--gris);border-radius:0;padding:10px 4px;font-size:12px}
.tabs button b{display:block;font-size:20px}
.tabs button.on{color:var(--azul2)}
.rol{display:flex;gap:8px;margin-top:4px}
.rol div{flex:1;border:2px solid var(--borde);border-radius:12px;padding:14px;text-align:center;cursor:pointer}
.rol div.on{border-color:var(--azul2);background:#eff6ff}
.rol div b{display:block;font-size:26px}
.alumno{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--borde)}
.alumno:last-child{border:0}
.alumno .nom{flex:1;min-width:0}
.alumno .nom small{color:var(--gris);display:block;font-size:12px}
.alumno.duda{background:#fef3c7;border-radius:8px;padding-left:6px}
.est{display:flex;gap:4px}
.est button{width:44px;height:44px;padding:0;background:#e2e8f0;color:#475569;font-size:15px}
.est button.P.on{background:var(--verde);color:#fff}
.est button.T.on{background:var(--amarillo);color:#fff}
.est button.A.on{background:var(--rojo);color:#fff}
.hora{width:86px;padding:6px;font-size:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.chip{padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600}
.cP{background:#dcfce7;color:#166534}.cT{background:#fef3c7;color:#92400e}.cA{background:#fee2e2;color:#991b1b}.cN{background:#e2e8f0;color:#334155}
.muted{color:var(--gris);font-size:13px}
.curso{border:1px solid var(--borde);border-radius:12px;padding:12px;margin-bottom:10px}
.curso summary{cursor:pointer;font-weight:700;list-style:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:10px;z-index:20;font-size:14px;max-width:90%;text-align:center}
.cargando{position:fixed;inset:0;background:#0f172acc;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:30;gap:14px;font-size:16px}
.spin{width:44px;height:44px;border:4px solid #fff4;border-top-color:#fff;border-radius:50%;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 6px;border-bottom:1px solid var(--borde);text-align:left}
.big{font-size:28px;font-weight:800}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{border-radius:12px;padding:10px}
.preview img{max-width:100%;border-radius:10px;margin-top:8px}
.x{background:none;color:var(--rojo);padding:6px 8px;font-size:18px}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="foto" accept="image/*" capture="environment" hidden>

<script>
/* =========================================================
   CAPA DE DATOS (hoy: localStorage — después: Cloudflare D1)
   Tablas:
     usuarios   {id,nombre,usuario,pass,rol}   rol: null (pendiente) | profe | director
     alumnos    {id,apellido,nombre,curso}            -> "alumnos totales"
     asistencias{id,fecha,alumnoId,curso,estado,hora,maestroId,ts} -> "alumnos asistentes" (P=presente,T=tarde,A=ausente)
   ========================================================= */
const DB={
  get:t=>JSON.parse(localStorage.getItem('esc_'+t)||'[]'),
  set:(t,v)=>localStorage.setItem('esc_'+t,JSON.stringify(v)),
};
const CFG={get:()=>JSON.parse(localStorage.getItem('esc_cfg')||'{}'),set:v=>localStorage.setItem('esc_cfg',JSON.stringify(v))};

const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const hoy=()=>new Date().toLocaleDateString('en-CA');
const ahora=()=>new Date().toTimeString().slice(0,5);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cap=s=>String(s||'').trim().toLowerCase().replace(/(^|\s|-)\S/g,m=>m.toUpperCase());
const nombreCompleto=a=>`${a.apellido}, ${a.nombre}`;
const cursos=()=>[...new Set(DB.get('alumnos').map(a=>a.curso))].sort();
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
function cargando(on,msg='La IA está leyendo la foto…'){let c=$('#carg');if(on){if(!c){c=document.createElement('div');c.id='carg';c.className='cargando';document.body.appendChild(c)}c.innerHTML=`<div class="spin"></div><div>${msg}</div>`}else c?.remove()}
async function hash(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch{return 'p_'+btoa(unescape(encodeURIComponent(t)))}}

/* ================= SESIÓN ================= */
/* CUENTA ADMINISTRADOR — usuario "adm".
   Cuando tengas el usuario y la contraseña definitivos se reemplazan acá
   (la contraseña se guarda como hash SHA-256, nunca en texto). */
const ADMIN={usuario:'adm',passHash:'d64acc11a39defb2be2226e5f9074a89b156a8371079a88a1ab9d4fd06d6f955',nombre:'Administrador'};
const ROLES={profe:'Profe',director:'Director',admin:'Administrador'};

let U=null, tab='', st={};
function usuarioActual(){const id=localStorage.getItem('esc_sesion');
  if(id==='__admin')return {id:'__admin',nombre:ADMIN.nombre,usuario:ADMIN.usuario,rol:'admin'};
  return DB.get('usuarios').find(u=>u.id===id)||null}
function salir(){localStorage.removeItem('esc_sesion');U=null;tab='';render()}

function pantallaAcceso(modo='login'){
  $('#app').innerHTML=`
  <header><div><h1>📋 Listado</h1><small>${modo==='crear'?'Crear cuenta':'Ingresar'}</small></div></header>
  <main>
   <div class="card">
    <h2>${modo==='crear'?'Crear cuenta':'Ingresar'}</h2>
    ${modo==='crear'?'<label>Nombre y apellido</label><input id="n" autocomplete="name">':''}
    <label>Usuario</label><input id="e" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label>Contraseña</label><input id="p" type="password" autocomplete="${modo==='crear'?'new-password':'current-password'}">
    ${modo==='crear'?'<p class="muted">El administrador va a asignar si tu cuenta es de Profe o de Director.</p>':''}
    <button class="full" onclick="${modo==='crear'?'crearCuenta()':'ingresar()'}">${modo==='crear'?'Crear cuenta':'Entrar'}</button>
    <p class="muted" style="text-align:center;margin-top:14px">
      ${modo==='crear'?'¿Ya tenés cuenta? <a href="#" onclick="pantallaAcceso(\'login\')">Ingresar</a>':'¿No tenés cuenta? <a href="#" onclick="pantallaAcceso(\'crear\')">Crear una</a>'}</p>
   </div>
  </main>`;
}
const limpiarUsuario=s=>s.trim().toLowerCase().replace(/\s+/g,'');
async function crearCuenta(){
  const n=$('#n').value.trim(),e=limpiarUsuario($('#e').value),p=$('#p').value;
  if(!n||!e||p.length<4)return toast('Completá todo (contraseña de 4+ caracteres)');
  const us=DB.get('usuarios');
  if(e===ADMIN.usuario||us.some(u=>u.usuario===e))return toast('Ese usuario ya existe');
  const u={id:uid(),nombre:n,usuario:e,pass:await hash(p),rol:null};
  us.push(u);DB.set('usuarios',us);localStorage.setItem('esc_sesion',u.id);render();
}
async function ingresar(){
  const e=limpiarUsuario($('#e').value),p=await hash($('#p').value);
  if(e===ADMIN.usuario&&p===ADMIN.passHash){localStorage.setItem('esc_sesion','__admin');return render()}
  const u=DB.get('usuarios').find(u=>u.usuario===e&&u.pass===p);
  if(!u)return toast('Usuario o contraseña incorrectos');
  localStorage.setItem('esc_sesion',u.id);render();
}
function pantallaEspera(){
  $('#app').innerHTML=`<header><div><h1>📋 Listado</h1><small>${esc(U.nombre)}</small></div><button class="sec" style="padding:8px 12px" onclick="salir()">Salir</button></header>
  <main><div class="card" style="text-align:center"><div class="big">⏳</div><h2>Cuenta creada</h2>
  <p class="muted">El administrador todavía no te asignó un rol (Profe o Director). Cuando lo haga, vas a poder entrar.</p>
  <button class="full sec" onclick="render()">Volver a revisar</button></div></main>`;
}

/* ================= CUENTAS (administrador) ================= */
function vCuentas(){
  const us=DB.get('usuarios').sort((a,b)=>(a.rol?1:0)-(b.rol?1:0)||a.nombre.localeCompare(b.nombre));
  const pend=us.filter(u=>!u.rol).length;
  $('#cont').innerHTML=`<div class="card"><h2>Cuentas (${us.length})</h2>
   ${pend?`<p class="chip cT" style="display:inline-block">${pend} esperando rol</p>`:''}
   ${us.map(u=>`<div class="alumno ${u.rol?'':'duda'}">
     <div class="nom">${esc(u.nombre)}<small>@${esc(u.usuario)}</small></div>
     <select style="width:auto" onchange="asignarRol('${u.id}',this.value)">
      <option value="" ${!u.rol?'selected':''}>Sin rol</option>
      <option value="profe" ${u.rol==='profe'?'selected':''}>Profe</option>
      <option value="director" ${u.rol==='director'?'selected':''}>Director</option>
     </select>
     <button class="x" onclick="resetPass('${u.id}')" title="Cambiar contraseña">🔑</button>
     <button class="x" onclick="borrarCuenta('${u.id}')">🗑</button></div>`).join('')||'<p class="muted">Todavía nadie creó una cuenta.</p>'}
  </div>`;
}
function asignarRol(id,rol){const us=DB.get('usuarios');us.find(u=>u.id===id).rol=rol||null;DB.set('usuarios',us);toast(rol?`Rol asignado: ${ROLES[rol]}`:'Rol quitado');render()}
async function resetPass(id){const p=prompt('Nueva contraseña (4+ caracteres):');if(!p)return;if(p.length<4)return toast('Muy corta');
  const us=DB.get('usuarios');us.find(u=>u.id===id).pass=await hash(p);DB.set('usuarios',us);toast('Contraseña cambiada')}
function borrarCuenta(id){if(!confirm('¿Borrar esta cuenta?'))return;DB.set('usuarios',DB.get('usuarios').filter(u=>u.id!==id));render()}

/* ================= LAYOUT ================= */
function render(){
  U=usuarioActual();
  if(!U)return pantallaAcceso('login');
  if(!U.rol)return pantallaEspera();
  const tabsM=[['lista','📝','Pasar lista'],['alumnos','👥','Alumnos'],['ajustes','⚙️','Ajustes']];
  const tabsD=[['panel','📊','Panel'],['buscar','🔎','Por alumno'],['alumnos','👥','Alumnos'],['ajustes','⚙️','Ajustes']];
  const tabsA=[['cuentas','🔐','Cuentas'],['panel','📊','Panel'],['buscar','🔎','Por alumno'],['alumnos','👥','Alumnos'],['ajustes','⚙️','Ajustes']];
  const tabs={profe:tabsM,director:tabsD,admin:tabsA}[U.rol]||tabsM;
  if(!tabs.some(t=>t[0]===tab))tab=tabs[0][0];
  $('#app').innerHTML=`
   <header><div><h1>📋 Listado</h1><small>${esc(U.nombre)} · ${ROLES[U.rol]||''}</small></div>
   <button class="sec" style="padding:8px 12px" onclick="salir()">Salir</button></header>
   <main id="cont"></main>
   <nav class="tabs">${tabs.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()"><b>${t[1]}</b>${t[2]}</button>`).join('')}</nav>`;
  ({lista:vLista,alumnos:vAlumnos,ajustes:vAjustes,panel:vPanel,buscar:vBuscar,cuentas:vCuentas})[tab]();
}

/* ================= PASAR LISTA (profe) ================= */
function vLista(){
  const cs=cursos();
  if(!cs.length){$('#cont').innerHTML=`<div class="card"><h2>Todavía no hay alumnos</h2><p class="muted">Primero cargá la lista de alumnos (por foto o escribiéndola).</p><button class="full" onclick="tab='alumnos';render()">👥 Cargar alumnos</button></div>`;return}
  st.curso=cs.includes(st.curso)?st.curso:cs[0];
  st.fecha=st.fecha||hoy();
  if(!st.marcas||st.marcasKey!==st.curso+st.fecha)cargarMarcas();
  const als=DB.get('alumnos').filter(a=>a.curso===st.curso).sort((a,b)=>nombreCompleto(a).localeCompare(nombreCompleto(b)));
  const c={P:0,T:0,A:0};als.forEach(a=>c[st.marcas[a.id]?.estado||'P']++);
  $('#cont').innerHTML=`
   <div class="card">
    <div class="fila">
     <div><label>Curso</label><select onchange="st.curso=this.value;render()">${cs.map(x=>`<option ${x===st.curso?'selected':''}>${esc(x)}</option>`).join('')}</select></div>
     <div><label>Fecha</label><input type="date" value="${st.fecha}" onchange="st.fecha=this.value;render()"></div>
    </div>
    <button class="full" onclick="pedirFoto('asistencia')">📷 Cargar lista en papel con foto</button>
    <div class="chips"><span class="chip cP">✔ ${c.P} presentes</span><span class="chip cT">⏰ ${c.T} tarde</span><span class="chip cA">✖ ${c.A} ausentes</span></div>
    <p class="muted">Todos arrancan presentes. Tocá <b>A</b> si faltó o <b>T</b> si llegó tarde.</p>
   </div>
   <div class="card">
    ${als.map(a=>{const m=st.marcas[a.id]||{estado:'P'};return `
     <div class="alumno ${m.duda?'duda':''}">
      <div class="nom">${esc(nombreCompleto(a))}${m.duda?`<small>⚠ Revisar: la IA leyó "${esc(m.leido||'?')}"</small>`:''}</div>
      ${m.estado==='T'?`<input type="time" class="hora" value="${m.hora||''}" onchange="st.marcas['${a.id}'].hora=this.value">`:''}
      <div class="est">${['P','T','A'].map(e=>`<button class="${e} ${m.estado===e?'on':''}" onclick="marcar('${a.id}','${e}')">${e}</button>`).join('')}</div>
     </div>`}).join('')}
    <button class="full verde" onclick="guardarLista()">💾 Guardar asistencia</button>
   </div>`;
}
function cargarMarcas(){
  st.marcas={};st.marcasKey=st.curso+st.fecha;
  DB.get('asistencias').filter(r=>r.fecha===st.fecha&&r.curso===st.curso).forEach(r=>st.marcas[r.alumnoId]={estado:r.estado,hora:r.hora});
}
function marcar(id,e){st.marcas[id]={estado:e,hora:e==='T'?(st.marcas[id]?.hora||ahora()):null};render()}
function guardarLista(){
  const als=DB.get('alumnos').filter(a=>a.curso===st.curso);
  let reg=DB.get('asistencias').filter(r=>!(r.fecha===st.fecha&&r.curso===st.curso));
  als.forEach(a=>{const m=st.marcas[a.id]||{estado:'P'};
    reg.push({id:uid(),fecha:st.fecha,alumnoId:a.id,curso:a.curso,estado:m.estado,hora:m.estado==='T'?m.hora:null,maestroId:U.id,ts:Date.now()})});
  DB.set('asistencias',reg);
  Object.values(st.marcas).forEach(m=>delete m.duda);
  toast('✅ Asistencia guardada');render();
}

/* ================= ALUMNOS ================= */
function vAlumnos(){
  const als=DB.get('alumnos'),cs=cursos();
  st.filtroCurso=st.filtroCurso??'';
  const ver=als.filter(a=>!st.filtroCurso||a.curso===st.filtroCurso).sort((a,b)=>(a.curso+nombreCompleto(a)).localeCompare(b.curso+nombreCompleto(b)));
  $('#cont').innerHTML=`
   ${st.nuevos?vRevisionAlumnos():''}
   <div class="card">
    <h2>Cargar alumnos</h2>
    <label>Curso (ej: 3°A)</label>
    <input id="cursoN" list="lc" value="${esc(st.ultimoCurso||'')}" placeholder="Si la foto lo dice, la IA lo detecta"><datalist id="lc">${cs.map(c=>`<option>${esc(c)}</option>`).join('')}</datalist>
    <button class="full" onclick="st.ultimoCurso=$('#cursoN').value;pedirFoto('alumnos')">📷 Foto de lista escrita a mano</button>
    <label>O escribí / pegá los nombres (uno por línea)</label>
    <textarea id="txt" placeholder="Pérez, Juan&#10;Gómez María&#10;..."></textarea>
    <div class="fila"><button class="full sec" onclick="textoALista(false)">➕ Agregar así</button><button class="full" onclick="textoALista(true)">✨ Ordenar con IA</button></div>
   </div>
   <div class="card">
    <div class="fila"><h2 style="margin:0">Alumnos (${als.length})</h2>
     <select onchange="st.filtroCurso=this.value;render()"><option value="">Todos los cursos</option>${cs.map(c=>`<option ${c===st.filtroCurso?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    ${ver.map(a=>`<div class="alumno"><div class="nom">${esc(nombreCompleto(a))}<small>${esc(a.curso)}</small></div><button class="x" onclick="borrarAlumno('${a.id}')">🗑</button></div>`).join('')||'<p class="muted">Sin alumnos.</p>'}
   </div>`;
}
function vRevisionAlumnos(){
  return `<div class="card" style="border:2px solid var(--azul2)">
   <h2>Revisá antes de guardar (${st.nuevos.length})</h2>
   <p class="muted">Corregí lo que haga falta. Las filas en amarillo la IA no las leyó seguro.</p>
   ${st.nuevos.map((a,i)=>`<div class="alumno ${a.duda?'duda':''}">
     <div class="nom fila" style="gap:4px">
      <input value="${esc(a.apellido)}" placeholder="Apellido" oninput="st.nuevos[${i}].apellido=this.value">
      <input value="${esc(a.nombre)}" placeholder="Nombre" oninput="st.nuevos[${i}].nombre=this.value">
      <input value="${esc(a.curso)}" placeholder="Curso" style="max-width:80px" oninput="st.nuevos[${i}].curso=this.value">
     </div><button class="x" onclick="st.nuevos.splice(${i},1);render()">✖</button></div>`).join('')}
   <div class="fila"><button class="full sec" onclick="st.nuevos=null;render()">Cancelar</button><button class="full verde" onclick="guardarNuevos()">💾 Guardar todos</button></div>
  </div>`;
}
async function textoALista(conIA){
  const t=$('#txt').value.trim(),curso=$('#cursoN').value.trim();st.ultimoCurso=curso;
  if(!t)return toast('Escribí al menos un nombre');
  if(conIA){
    try{cargando(true,'La IA está ordenando la lista…');const r=await IA.alumnos({texto:t,curso});st.nuevos=r}catch(e){toast('IA: '+e.message)}finally{cargando(false)}
  }else{
    st.nuevos=t.split(/\n+/).map(l=>l.replace(/^\s*\d+[\.\)\-]?\s*/,'').trim()).filter(Boolean).map(l=>{
      let ap,no; if(l.includes(',')){[ap,no]=l.split(',')}else{const p=l.split(/\s+/);ap=p[0];no=p.slice(1).join(' ')}
      return {apellido:cap(ap),nombre:cap(no),curso}});
  }
  render();
}
function guardarNuevos(){
  const faltaCurso=st.nuevos.some(a=>!String(a.curso).trim());
  if(faltaCurso)return toast('Hay alumnos sin curso');
  const als=DB.get('alumnos');let n=0;
  st.nuevos.forEach(a=>{const ap=cap(a.apellido),no=cap(a.nombre),cu=a.curso.trim().toUpperCase();
    if(!ap&&!no)return;
    if(als.some(x=>x.apellido===ap&&x.nombre===no&&x.curso===cu))return;
    als.push({id:uid(),apellido:ap,nombre:no,curso:cu});n++});
  DB.set('alumnos',als);st.nuevos=null;toast(`✅ ${n} alumnos guardados`);render();
}
function borrarAlumno(id){if(!confirm('¿Borrar este alumno?'))return;DB.set('alumnos',DB.get('alumnos').filter(a=>a.id!==id));render()}

/* ================= PANEL DIRECTOR ================= */
function vPanel(){
  st.pFecha=st.pFecha||hoy();
  const als=DB.get('alumnos'),reg=DB.get('asistencias').filter(r=>r.fecha===st.pFecha);
  const porAl=Object.fromEntries(reg.map(r=>[r.alumnoId,r]));
  const tot={P:0,T:0,A:0,N:0};
  const bloques=cursos().map(c=>{
    const ac=als.filter(a=>a.curso===c),k={P:[],T:[],A:[],N:[]};
    ac.forEach(a=>{const r=porAl[a.id];k[r?r.estado:'N'].push({a,r})});
    Object.keys(k).forEach(x=>tot[x]+=k[x].length);
    return `<details class="curso"><summary>${esc(c)} <span class="muted">(${ac.length})</span>
      <div class="chips"><span class="chip cP">✔ ${k.P.length}</span><span class="chip cT">⏰ ${k.T.length}</span><span class="chip cA">✖ ${k.A.length}</span>${k.N.length?`<span class="chip cN">Sin cargar ${k.N.length}</span>`:''}</div></summary>
      ${k.A.length?`<b style="color:var(--rojo)">Ausentes</b>${k.A.map(x=>`<div class="alumno"><div class="nom">${esc(nombreCompleto(x.a))}</div></div>`).join('')}`:''}
      ${k.T.length?`<b style="color:var(--amarillo)">Tarde</b>${k.T.map(x=>`<div class="alumno"><div class="nom">${esc(nombreCompleto(x.a))}</div><span class="muted">${x.r.hora||''}</span></div>`).join('')}`:''}
      ${!k.A.length&&!k.T.length?'<p class="muted">Sin ausentes ni tardes.</p>':''}
    </details>`}).join('');
  $('#cont').innerHTML=`
   <div class="card">
    <label>Día</label><input type="date" value="${st.pFecha}" onchange="st.pFecha=this.value;render()">
    <div class="stats" style="margin-top:12px">
     <div class="cP"><div class="big">${tot.P}</div>Presentes</div>
     <div class="cT"><div class="big">${tot.T}</div>Tarde</div>
     <div class="cA"><div class="big">${tot.A}</div>Ausentes</div>
    </div>
    ${tot.N?`<p class="muted">${tot.N} alumnos sin lista cargada este día.</p>`:''}
   </div>
   <div class="card"><h2>Por curso</h2>${bloques||'<p class="muted">No hay alumnos cargados.</p>'}</div>
   ${vRanking()}`;
}
function vRanking(){
  const als=DB.get('alumnos'),reg=DB.get('asistencias');
  const m={};reg.forEach(r=>{m[r.alumnoId]=m[r.alumnoId]||{A:0,T:0};if(r.estado!=='P')m[r.alumnoId][r.estado]++});
  const top=als.map(a=>({a,...(m[a.id]||{A:0,T:0})})).filter(x=>x.A||x.T).sort((x,y)=>y.A-x.A||y.T-x.T).slice(0,10);
  if(!top.length)return '';
  return `<div class="card"><h2>Más faltas (histórico)</h2><table><tr><th>Alumno</th><th>Curso</th><th>Faltas</th><th>Tardes</th></tr>
   ${top.map(x=>`<tr onclick="st.bAlumno='${x.a.id}';tab='buscar';render()" style="cursor:pointer"><td>${esc(nombreCompleto(x.a))}</td><td>${esc(x.a.curso)}</td><td>${x.A}</td><td>${x.T}</td></tr>`).join('')}</table></div>`;
}
function vBuscar(){
  const als=DB.get('alumnos').sort((a,b)=>nombreCompleto(a).localeCompare(nombreCompleto(b)));
  st.bQ=st.bQ||'';const d=new Date();d.setDate(1);
  st.bDesde=st.bDesde||d.toLocaleDateString('en-CA');st.bHasta=st.bHasta||hoy();
  const q=st.bQ.toLowerCase();
  const lista=als.filter(a=>(nombreCompleto(a)+' '+a.curso).toLowerCase().includes(q));
  const sel=als.find(a=>a.id===st.bAlumno);
  let detalle='';
  if(sel){
    const reg=DB.get('asistencias').filter(r=>r.alumnoId===sel.id&&r.fecha>=st.bDesde&&r.fecha<=st.bHasta).sort((a,b)=>b.fecha.localeCompare(a.fecha));
    const c={P:0,T:0,A:0};reg.forEach(r=>c[r.estado]++);
    const tx={P:'Presente',T:'Tarde',A:'Ausente'};
    detalle=`<div class="card" style="border:2px solid var(--azul2)">
     <h2>${esc(nombreCompleto(sel))} <span class="muted">· ${esc(sel.curso)}</span></h2>
     <div class="fila"><div><label>Desde</label><input type="date" value="${st.bDesde}" onchange="st.bDesde=this.value;render()"></div><div><label>Hasta</label><input type="date" value="${st.bHasta}" onchange="st.bHasta=this.value;render()"></div></div>
     <div class="stats" style="margin-top:12px"><div class="cP"><div class="big">${c.P}</div>Presente</div><div class="cT"><div class="big">${c.T}</div>Tarde</div><div class="cA"><div class="big">${c.A}</div>Ausente</div></div>
     ${reg.length?`<p class="muted">Asistencia: ${Math.round((c.P+c.T)/reg.length*100)}% de ${reg.length} días</p>`:''}
     <table><tr><th>Fecha</th><th>Estado</th><th>Hora</th></tr>${reg.map(r=>`<tr><td>${r.fecha.split('-').reverse().join('/')}</td><td><span class="chip c${r.estado}">${tx[r.estado]}</span></td><td>${r.hora||''}</td></tr>`).join('')||'<tr><td colspan=3 class="muted">Sin registros en el rango</td></tr>'}</table>
     <button class="full sec" onclick="st.bAlumno=null;render()">Cerrar</button></div>`;
  }
  $('#cont').innerHTML=`${detalle}
   <div class="card"><label>Buscar alumno o curso</label><input id="bq" value="${esc(st.bQ)}" placeholder="Nombre, apellido o curso" oninput="st.bQ=this.value;render();const i=$('#bq');i.focus();i.setSelectionRange(i.value.length,i.value.length)">
   ${lista.slice(0,60).map(a=>`<div class="alumno" onclick="st.bAlumno='${a.id}';render();scrollTo(0,0)" style="cursor:pointer"><div class="nom">${esc(nombreCompleto(a))}<small>${esc(a.curso)}</small></div>›</div>`).join('')}
   </div>`;
}

/* ================= AJUSTES ================= */
function vAjustes(){
  const c=CFG.get();
  $('#cont').innerHTML=`
   <div class="card"><h2>🤖 Inteligencia artificial</h2>
    <label>Modo</label>
    <select id="modo"><option value="directo" ${c.modo!=='servidor'?'selected':''}>Clave de Claude (para probar)</option><option value="servidor" ${c.modo==='servidor'?'selected':''}>Mi servidor Cloudflare</option></select>
    <label>Clave API de Anthropic (solo modo prueba)</label><input id="key" type="password" value="${esc(c.key||'')}" placeholder="sk-ant-...">
    <label>URL del servidor (Worker de Cloudflare)</label><input id="url" value="${esc(c.url||'')}" placeholder="https://asistencia.tuusuario.workers.dev/ia">
    <label>Modelo</label><input id="modelo" value="${esc(c.modelo||'claude-sonnet-5-5')}">
    <button class="full" onclick="CFG.set({modo:$('#modo').value,key:$('#key').value.trim(),url:$('#url').value.trim(),modelo:$('#modelo').value.trim()});toast('Guardado')">Guardar</button>
    <p class="muted">En la app final la clave va en el servidor, nunca en el celular.</p>
   </div>
   <div class="card"><h2>💾 Datos</h2>
    <button class="full sec" onclick="exportar()">⬇ Descargar copia (JSON)</button>
    <button class="full sec" onclick="exportarCSV()">⬇ Asistencias en CSV (Excel)</button>
    <label>Restaurar copia</label><input type="file" accept=".json" onchange="importar(this.files[0])">
   </div>`;
}
function descargar(nombre,txt,tipo){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:tipo}));a.download=nombre;a.click()}
function exportar(){descargar(`asistencia-${hoy()}.json`,JSON.stringify({usuarios:DB.get('usuarios'),alumnos:DB.get('alumnos'),asistencias:DB.get('asistencias')}),'application/json')}
function exportarCSV(){const al=Object.fromEntries(DB.get('alumnos').map(a=>[a.id,a]));
  const f=DB.get('asistencias').map(r=>[r.fecha,r.curso,al[r.alumnoId]?.apellido,al[r.alumnoId]?.nombre,r.estado,r.hora||''].map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';'));
  descargar(`asistencias-${hoy()}.csv`,'﻿Fecha;Curso;Apellido;Nombre;Estado;Hora\n'+f.join('\n'),'text/csv')}
async function importar(f){if(!f)return;try{const d=JSON.parse(await f.text());['usuarios','alumnos','asistencias'].forEach(t=>d[t]&&DB.set(t,d[t]));toast('Datos restaurados');render()}catch{toast('Archivo inválido')}}

/* ================= FOTO + IA ================= */
let modoFoto='';
function pedirFoto(m){modoFoto=m;const i=$('#foto');i.value='';i.click()}
$('#foto').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    cargando(true);
    const img=await comprimir(f);
    if(modoFoto==='alumnos'){
      st.nuevos=await IA.alumnos({img,curso:st.ultimoCurso||''});
      if(!st.nuevos.length)toast('No se encontraron nombres en la foto');
    }else{
      const als=DB.get('alumnos').filter(a=>a.curso===st.curso);
      const r=await IA.asistencia({img,alumnos:als,fecha:st.fecha});
      let n=0;
      r.marcas.forEach(m=>{if(!als.some(a=>a.id===m.id))return;
        st.marcas[m.id]={estado:['P','T','A'].includes(m.estado)?m.estado:'P',hora:m.estado==='T'?(m.hora||ahora()):null,duda:(m.confianza??1)<0.75,leido:m.leido};n++});
      toast(`IA marcó ${n} alumnos${r.no_encontrados?.length?` · ${r.no_encontrados.length} nombres no están en el curso: ${r.no_encontrados.join(', ')}`:''}. Revisá y guardá.`);
    }
  }catch(err){toast('No se pudo leer: '+err.message)}
  finally{cargando(false);render()}
};
function comprimir(file,max=1800){return new Promise((ok,mal)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
  let {width:w,height:h}=im;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  x.filter='contrast(1.15) brightness(1.05)';x.drawImage(im,0,0,w,h);
  ok(c.toDataURL('image/jpeg',0.88).split(',')[1])};im.onerror=mal;im.src=r.result};r.onerror=mal;r.readAsDataURL(file)})}

const IA={
  async llamar(prompt,img){
    const c=CFG.get(),modelo=c.modelo||'claude-sonnet-5-5';
    const content=[];if(img)content.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:img}});content.push({type:'text',text:prompt});
    let texto;
    if(c.modo==='servidor'){
      if(!c.url)throw Error('Configurá la URL del servidor en Ajustes');
      const r=await fetch(c.url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({prompt,image:img,modelo})});
      if(!r.ok)throw Error('Servidor '+r.status);texto=(await r.json()).text;
    }else{
      if(!c.key)throw Error('Poné tu clave de IA en Ajustes');
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:modelo,max_tokens:4096,temperature:0,messages:[{role:'user',content}]})});
      const j=await r.json();if(!r.ok)throw Error(j.error?.message||r.status);texto=j.content.map(b=>b.text||'').join('');
    }
    const m=texto.match(/\{[\s\S]*\}/);if(!m)throw Error('Respuesta de la IA sin datos');
    return JSON.parse(m[0]);
  },
  async alumnos({img,texto,curso}){
    const p=`Sos un experto en leer listas de alumnos de escuelas argentinas, incluso escritas a mano con mala letra, tachones, abreviaturas o faltas de ortografía.
${img?'Leé la lista de la imagen con mucho cuidado, línea por línea. Ignorá encabezados, firmas, números de orden, columnas de fechas y marcas de asistencia.':'Este es el texto que escribió el usuario:\n"""\n'+texto+'\n"""'}
Tareas:
1. Extraé cada alumno separando APELLIDO y NOMBRE (en listas escolares suele ir primero el apellido; si hay coma, lo de antes de la coma es el apellido).
2. Corregí errores obvios de nombres y apellidos comunes en Argentina (ej: "Gonsales"→"González", "Maria"→"María") y usá mayúscula inicial. No inventes nombres.
3. Curso: ${curso?`usá "${curso}" salvo que la hoja indique claramente otro curso por alumno.`:'si la hoja indica curso o grado (ej "3°A", "5to B") usalo en formato como "3°A"; si no, dejalo vacío.'}
4. Si una palabra es dudosa, poné tu mejor lectura y marcá "duda": true.
Respondé SOLO con JSON, sin texto extra:
{"alumnos":[{"apellido":"","nombre":"","curso":"","duda":false}]}`;
    const r=await this.llamar(p,img);
    return (r.alumnos||[]).map(a=>({apellido:cap(a.apellido),nombre:cap(a.nombre),curso:(a.curso||curso||'').toUpperCase(),duda:!!a.duda}));
  },
  async asistencia({img,alumnos,fecha}){
    const lista=alumnos.map(a=>`${a.id} | ${a.apellido}, ${a.nombre}`).join('\n');
    const p=`Sos un experto en leer planillas de asistencia escolares en papel, escritas a mano, de escuelas argentinas.
Estos son los alumnos del curso (id | Apellido, Nombre):
${lista}

Leé la foto con mucho cuidado. Para cada alumno que aparece:
- Relacionalo con el "id" correcto de la lista aunque esté abreviado, sin tilde, solo con apellido o con faltas de ortografía.
- Interpretá la marca: P, ✓, •, "pte", "presente" → "P". A, X, ✗, "aus", "falta", "F" → "A". T, "tarde", "LT" o una hora escrita (ej 8:15) → "T" con esa hora en formato HH:MM.
- Si la planilla tiene varias columnas de días, usá la del día ${fecha} (día ${Number(fecha.slice(8))}); si no se puede saber, usá la última columna con marcas.
- Si la hoja solo lista ausentes o tardes, los demás alumnos de la lista son "P".
- "confianza" de 0 a 1 según qué tan seguro estás de la lectura. "leido" = cómo aparece escrito en la foto.
Respondé SOLO con JSON, sin texto extra:
{"marcas":[{"id":"","estado":"P","hora":null,"confianza":1,"leido":""}],"no_encontrados":["nombres de la foto que no están en la lista"]}`;
    const r=await this.llamar(p,img);r.marcas=r.marcas||[];return r;
  }
};

render();
